<!doctype html><html><body style="margin:0;background:#333">
<iframe id="f" style="border:0;width:100vw;height:100vh;display:block"></iframe>
<script>
var q=new URLSearchParams(location.search); var f=document.getElementById('f'); if(q.get('iw')){f.style.width=q.get('iw')+'px'; f.style.height=q.get('ih')+'px';}
try{sessionStorage.setItem('np2-loaded','1')}catch(e){}
f.src=(q.get('p')||'index.html');
f.onload=function(){var w=f.contentWindow; var sel=q.get('s'); var y=parseFloat(q.get('y')||0);
 setTimeout(function(){ var t=y; if(sel){var el=w.document.querySelector(sel); if(el) t=el.getBoundingClientRect().top+w.scrollY+y;} w.document.documentElement.style.scrollBehavior='auto'; w.document.querySelectorAll('[data-reveal],[data-split]').forEach(function(e){e.classList.add('is-in')}); w.scrollTo(0,t); w.dispatchEvent(new Event('scroll')); },300);};
</script></body></html>
